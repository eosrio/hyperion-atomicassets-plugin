name: Owned BSON JSONB display MongoDB managed HTTP
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths: ["scripts/qualification/jsonb-display-bson-v3/**", "tests/owned-bson-display-v3.test.mjs", ".github/workflows/jsonb-display-bson-v3.yml", "src/**", "package*.json"]
permissions:
  contents: read
  actions: read
jobs:
  owned-display:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.1', '26.4.0']
        profile: [original-lifecycle, portable-safe-image]
    env:
      HYPERION_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch exact immutable workload and product source objects
        run: git fetch --no-tags --depth=1 origin d192357a03e1a48a19528ff0086e8e81b62ac562 a410e16497bd2a6529b72691bad03507f90dcc7f 2294d97f0e248ab68c4e6792b63523e230622b2c
      - uses: actions/checkout@v4
        with:
          repository: eosrio/hyperion-history-api
          ref: 7270b1eba0e4e118e61fd282dbf44a66f361df47
          path: out/jsonb-display-inputs/hapi
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: npm ci --allow-git=all
      - run: npm ci --prefix out/jsonb-display-inputs/hapi/packages/backend-mongodb --allow-git=all --ignore-scripts=false
      - run: npm ci --prefix out/jsonb-display-inputs/hapi --allow-git=all
      - run: npm run build
      - run: npm run build --prefix out/jsonb-display-inputs/hapi
      - run: npm run typecheck
      - run: npm run typecheck --prefix out/jsonb-display-inputs/hapi
      - name: Pure original codec and owned-controller controls
        run: node --test tests/jsonb-display-mongo-http.test.mjs tests/owned-bson-display-v3.test.mjs scripts/qualification/jsonb-display-mongo-http-ci/sdk-cohort.test.mjs scripts/qualification/jsonb-display-bson-v3/*.test.mjs
      - name: Qualify exclusively owned MongoDB and actual managed HTTP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/qualification/jsonb-display-bson-v3/ci.mjs ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jsonb-display-bson-v3-${{ matrix.node }}-${{ matrix.profile }}
          path: out/jsonb-display-bson-v3-owned-${{ matrix.profile }}
          if-no-files-found: warn
